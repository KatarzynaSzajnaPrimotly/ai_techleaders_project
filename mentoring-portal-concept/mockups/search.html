<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search tutors — Mentora</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="search">
  <div id="headerSlot"></div>

  <div class="container">
    <form class="search-bar" id="searchForm" style="max-width:480px; margin:20px 0 0;">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Subject, e.g. Spanish" autocomplete="off" />
    </form>

    <div class="search-layout">
      <aside class="filter-panel">
        <div class="filter-group">
          <label class="filter-title">Price per hour</label>
          <input type="range" id="priceRange" min="5" max="60" value="60" />
          <div style="font-size:12px; color:var(--color-text-muted);" id="priceRangeOut">up to $60/hr</div>
        </div>
        <div class="filter-group">
          <label class="filter-title">Tutor speaks natively</label>
          <label class="filter-row-check"><input type="checkbox" /> Native speaker only</label>
        </div>
        <div class="filter-group">
          <label class="filter-title">Minimum rating</label>
          <label class="filter-row-check"><input type="checkbox" /> 4.5+ stars</label>
          <label class="filter-row-check"><input type="checkbox" /> 4.0+ stars</label>
        </div>
        <div class="filter-group">
          <label class="filter-title">Booking</label>
          <label class="filter-row-check"><input type="checkbox" /> Instant book only</label>
        </div>
        <button class="btn btn-ghost btn-sm" id="resetFiltersBtn">Reset filters</button>
      </aside>

      <main>
        <div class="results-toolbar">
          <div class="results-count" id="resultsCount"></div>
          <select class="select" id="sortSelect">
            <option value="best">Best match</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="rating">Highest rated</option>
          </select>
        </div>
        <div class="results-list" id="resultsList"></div>
      </main>
    </div>
  </div>

  <div id="footerSlot"></div>
  <div id="devToolbarSlot"></div>

  <script src="dist/data.js"></script>
  <script src="dist/state.js"></script>
  <script src="dist/components.js"></script>
  <script src="dist/pages/pages-common.js"></script>
  <script src="dist/pages/pages-search.js"></script>
  <script src="dist/pages/pages-booking.js"></script>
  <script src="dist/pages/pages-dashboard.js"></script>
  <script src="dist/pages/pages-tutor.js"></script>
  <script src="dist/pages/pages-admin.js"></script>
  <script src="dist/main.js"></script>
</body>
</html>
