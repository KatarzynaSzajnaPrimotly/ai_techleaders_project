<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar & availability — Mentora</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="tutor-calendar">
  <div id="headerSlot"></div>

  <div class="container" style="padding:24px 0 60px;">
    <div class="page-title-row"><h1>Calendar & availability</h1><button class="btn btn-primary" id="saveAvailabilityBtn">Save changes</button></div>

    <div style="display:flex; gap:24px; flex-wrap:wrap; margin-bottom:20px;">
      <label class="checkbox-row"><input type="checkbox" id="instantBookToggle" checked /> Instant book (skip manual approval)</label>
      <button class="btn btn-ghost btn-sm" id="connectGoogleBtn">Connect Google Calendar</button>
    </div>

    <p class="hint" style="margin-bottom:10px;">Click cells to toggle your weekly recurring availability.</p>
    <div class="availability-grid" id="tutorAvailGrid"></div>
  </div>

  <div id="footerSlot"></div>

  <script src="dist/data.js"></script>
  <script src="dist/state.js"></script>
  <script src="dist/components.js"></script>
  <script src="dist/pages/pages-common.js"></script>
  <script src="dist/pages/pages-search.js"></script>
  <script src="dist/pages/pages-booking.js"></script>
  <script src="dist/pages/pages-dashboard.js"></script>
  <script src="dist/pages/pages-tutor.js"></script>
  <script src="dist/pages/pages-admin.js"></script>
  <script src="dist/main.js"></script>
</body>
</html>
